# Application Configuration
server.port=8080
spring.application.name=expense-tracker-api

# MySQL Database Configuration
# We assume the database is named 'expense_tracker' and runs on localhost
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345t

# Hibernate Configuration
# update mode will automatically create/update database tables based on our entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT Secret Key (In production, this should be an environment variable)
# Using a base64 encoded strong random key
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
